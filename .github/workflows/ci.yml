# Smoke test on every push and pull request (HS5; closes RISK_LOG RL-05 once it has run green).
# Same steps as the README's "Verify your setup": preflight, reference run, test suite.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.14"
            requirements: requirements-lock.txt
          - os: ubuntu-latest
            python: "3.14"
            requirements: requirements-lock.txt
          - os: ubuntu-latest
            python: "3.11"
            requirements: requirements.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for check_env.py and the fingerprint check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python check_env.py
      - name: Reference run matches evidence/hs5/main_expected.txt
        shell: bash
        run: python main.py | diff --strip-trailing-cr - evidence/hs5/main_expected.txt
      - run: python validation/hs5_verify_evidence.py
      - run: python -m pytest -q -p no:cacheprovider
